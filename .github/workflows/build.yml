name: Build victara Mainline Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_URL: https://gitlab.com/vanadium-oss/motorola-msm8974/mainline/linux-msm8974.git
  KERNEL_REF: qcom-msm8974-6.16.y

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq bc bison busybox-static cpio device-tree-compiler dropbear-bin flex gcc-arm-linux-gnueabihf git gzip libssl-dev make python3 xz-utils zstd

      - name: Build kernel and DTBs
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_URL" kernel
          cd kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- msm8974_defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm/configs/victara.config
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          # Verify merged configs made it into .config
          grep "CONFIG_WATCHDOG=y" .config
          grep "CONFIG_QCOM_WDT=y" .config
          grep "CONFIG_DRM_MSM=y" .config
          grep "CONFIG_DRM_PANEL_SAMSUNG_S6E3FA2_FULL=y" .config
          grep "CONFIG_TOUCHSCREEN_ATMEL_MXT=y" .config
          grep "CONFIG_BATTERY_MAX17042=y" .config
          grep "CONFIG_WCN36XX=y" .config
          grep "CONFIG_CFG80211=y" .config
          grep "CONFIG_MAC80211=y" .config
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j"$(nproc)" zImage dtbs modules
          test -s arch/arm/boot/zImage
          test -s arch/arm/boot/dts/qcom/msm8974pro-motorola-victara.dtb
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -s kernelrelease | tee ../kernel-release.txt
          cd ..

      - name: Build no-ids DTB variant and appended zImage-dtb
        run: |
          set -euxo pipefail
          mkdir -p out
          KREL="$(cat kernel-release.txt)"
          cp kernel/arch/arm/boot/zImage out/zImage
          cp kernel/arch/arm/boot/dts/qcom/msm8974pro-motorola-victara.dtb out/msm8974pro-motorola-victara.dtb
          cp kernel/.config "out/kernel.config-$KREL"
          cp kernel/.config out/kernel.config
          cp kernel/System.map out/System.map
          cp kernel-release.txt out/

          # Build variant without qcom,msm-id for permissive bootloaders
          dtc -I dtb -O dts -o victara.dts out/msm8974pro-motorola-victara.dtb
          sed -i '/qcom,msm-id =/d' victara.dts
          dtc -I dts -O dtb -o out/victara-noids.dtb victara.dts
          python3 -c "b=open('out/victara-noids.dtb','rb').read(); assert b[:4]==b'\xd0\x0d\xfe\xed' and b'msm-id' not in b"

          # Appended DTB zImage
          cat out/zImage out/msm8974pro-motorola-victara.dtb > out/zImage-dtb
          cat out/zImage out/victara-noids.dtb > out/zImage-dtb-noids

      - name: Export kernel modules and firmware
        run: |
          set -euxo pipefail
          KREL="$(cat kernel-release.txt)"
          rm -rf modules-root
          mkdir -p modules-root
          make -C kernel ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- INSTALL_MOD_PATH="$PWD/modules-root" INSTALL_MOD_STRIP=1 modules_install
          tar -I 'zstd -T0 -10' -cf "out/kernel-modules-$KREL.tar.zst" -C modules-root lib/modules
          tar -czf "out/kernel-modules-$KREL.tar.gz" -C modules-root lib/modules

          # Package WiFi firmware
          tar -czf out/victara-firmware-wcnss.tar.gz -C firmware .

      - name: Build Alpine ARMv7 rootfs ramdisk
        run: |
          set -euxo pipefail
          rm -rf irm
          mkdir -p irm

          # 1. Unpack official Alpine ARMv7 Minirootfs
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/armv7/alpine-minirootfs-3.20.10-armv7.tar.gz | tar -xz -C irm

          # 2. Extract static apk-tools, WiFi, disk tools and remote access packages
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/apk-tools-static-2.14.4-r1.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/dropbear-2024.85-r0.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/wpa_supplicant-2.10-r11.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/iw-6.9-r0.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/wireless-regdb-2024.05.08-r0.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/libnl3-3.9.0-r1.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/dbus-libs-1.14.10-r1.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/pcsc-lite-libs-2.2.3-r0.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/e2fsprogs-1.47.0-r5.apk | tar -xz -C irm
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/e2fsprogs-libs-1.47.0-r5.apk | tar -xz -C irm

          # Unify shared libraries and create helper symlinks
          cp -aP irm/usr/lib/* irm/lib/ 2>/dev/null || true
          chmod +x irm/sbin/apk* irm/usr/sbin/dropbear* irm/usr/sbin/wpa* irm/usr/sbin/iw 2>/dev/null || true
          ln -sf /sbin/apk irm/bin/apk
          ln -sf /sbin/apk.static irm/bin/apk.static
          ln -sf /usr/sbin/iw irm/bin/iw
          ln -sf /usr/sbin/wpa_supplicant irm/bin/wpa_supplicant
          ln -sf /usr/sbin/wpa_cli irm/bin/wpa_cli

          # 3. Copy kernel modules and WiFi firmware
          if [ -d modules-root/lib/modules ]; then
            mkdir -p irm/lib/modules
            cp -a modules-root/lib/modules/* irm/lib/modules/ 2>/dev/null || true
          fi
          rm -rf modules-root

          mkdir -p irm/lib/firmware/wlan/prima
          cp -r firmware/* irm/lib/firmware/
          cp -r firmware/* irm/lib/firmware/wlan/prima/

          # 4. Generate Dropbear host keys
          mkdir -p irm/etc/dropbear irm/var/log irm/var/run/wpa_supplicant irm/tmp irm/root
          chmod 1777 irm/tmp
          dropbearkey -t ed25519 -f irm/etc/dropbear/dropbear_ed25519_host_key
          dropbearkey -t rsa -f irm/etc/dropbear/dropbear_rsa_host_key

          # 5. Configure users, DNS, and APK repositories
          echo "root:x:0:0:root:/root:/bin/sh" > irm/etc/passwd
          echo "root:::0:99999:7:::" > irm/etc/shadow
          echo "root:x:0:root" > irm/etc/group
          chmod 700 irm/root

          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > irm/etc/resolv.conf
          printf '127.0.0.1 localhost victara\n::1 localhost ip6-localhost ip6-loopback\n' > irm/etc/hosts
          printf 'victara\n' > irm/etc/hostname

          mkdir -p irm/etc/apk
          printf '%s\n%s\n' \
            "https://dl-cdn.alpinelinux.org/alpine/v3.20/main" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.20/community" > irm/etc/apk/repositories

          # 6. Helper scripts: wifi-connect, wifi-scan, battery, install-to-emmc
          cat > irm/usr/bin/wifi-connect <<'EOF_WIFI'
#!/bin/sh
SSID="$1"
PASS="$2"

if [ -z "$SSID" ] || [ -z "$PASS" ]; then
  echo "Uso: wifi-connect <SSID> <SENHA>"
  echo "Exemplo: wifi-connect 'VIVOFIBRA-WIFI6-D688' 'minhasenha'"
  exit 1
fi

echo "[*] Preparando interface wlan0..."
ip link set wlan0 up 2>/dev/null || true

echo "[*] Gerando configuracao Wi-Fi (PMF desativado para compatibilidade com routers Wi-Fi 6)..."
mkdir -p /etc/wpa_supplicant /var/run/wpa_supplicant
cat > /etc/wpa_supplicant/wpa_supplicant.conf <<CONF
ctrl_interface=/var/run/wpa_supplicant
update_config=1

network={
    ssid="$SSID"
    psk="$PASS"
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
    group=CCMP
    ieee80211w=0
}
CONF
chmod 600 /etc/wpa_supplicant/wpa_supplicant.conf

echo "[*] Reiniciando wpa_supplicant..."
killall wpa_supplicant 2>/dev/null || true
sleep 1
wpa_supplicant -B -i wlan0 -c /etc/wpa_supplicant/wpa_supplicant.conf

echo "[*] Aguardando conexao com $SSID..."
CONNECTED=0
for i in $(seq 1 15); do
  if iw dev wlan0 link 2>/dev/null | grep -q "Connected to"; then
    CONNECTED=1
    echo "[+] Conectado com sucesso ao AP!"
    break
  fi
  sleep 1
done

if [ "$CONNECTED" -eq 0 ]; then
  echo "[-] Timeout na associacao. Verifique a senha ou execute: wpa_cli -i wlan0 status"
  exit 1
fi

echo "[*] Solicitando IP via DHCP (udhcpc)..."
killall udhcpc 2>/dev/null || true
udhcpc -i wlan0 -n -q -t 5

echo ""
echo "=== Status da Conexao ==="
ip addr show wlan0 | grep "inet " || echo "[-] Falha ao obter IP."
EOF_WIFI
          chmod +x irm/usr/bin/wifi-connect
          ln -sf /usr/bin/wifi-connect irm/bin/wifi-connect

          cat > irm/usr/bin/wifi-scan <<'EOF_SCAN'
#!/bin/sh
ip link set wlan0 up 2>/dev/null || true
echo "[*] Escaneando redes Wi-Fi..."
iw dev wlan0 scan 2>/dev/null | grep -E 'SSID:|signal:|freq:' | sed 's/^[ \t]*//'
EOF_SCAN
          chmod +x irm/usr/bin/wifi-scan
          ln -sf /usr/bin/wifi-scan irm/bin/wifi-scan

          cat > irm/usr/bin/battery <<'EOF_BAT'
#!/bin/sh
echo "=== Status de Bateria & Energia (MAX17048) ==="
FOUND=0
for f in /sys/class/power_supply/*; do
  [ -d "$f" ] || continue
  FOUND=1
  dev=$(basename "$f")
  type=$(cat "$f/type" 2>/dev/null || echo "Unknown")
  cap=$(cat "$f/capacity" 2>/dev/null || echo "N/A")
  stat=$(cat "$f/status" 2>/dev/null || echo "N/A")
  volt=$(cat "$f/voltage_now" 2>/dev/null || echo "N/A")
  curr=$(cat "$f/current_now" 2>/dev/null || echo "N/A")
  echo "Dispositivo: $dev ($type)"
  [ "$cap" != "N/A" ] && echo "  Carga: ${cap}%"
  [ "$stat" != "N/A" ] && echo "  Status: $stat"
  [ "$volt" != "N/A" ] && echo "  Tensao: $((volt / 1000)) mV"
  [ "$curr" != "N/A" ] && echo "  Corrente: $((curr / 1000)) mA"
done
[ "$FOUND" -eq 0 ] && echo "Nenhum dispositivo em /sys/class/power_supply/"
EOF_BAT
          chmod +x irm/usr/bin/battery
          ln -sf /usr/bin/battery irm/bin/battery

          cat > irm/usr/bin/install-to-emmc <<'EOF_INST'
#!/bin/sh
set -e
TARGET="/dev/mmcblk0p28"
echo "=== Instalador Alpine Linux para eMMC ($TARGET) ==="
if [ ! -b "$TARGET" ]; then
  echo "Erro: $TARGET nao encontrado!"
  exit 1
fi
echo "Formatando $TARGET como ext4..."
mkfs.ext4 -F -L "userdata" "$TARGET"
mkdir -p /mnt/target
mount "$TARGET" /mnt/target
echo "Copiando sistema de arquivos para o eMMC..."
cp -a /bin /sbin /usr /lib /etc /root /var /mnt/target/
mkdir -p /mnt/target/proc /mnt/target/sys /mnt/target/dev /mnt/target/tmp /mnt/target/mnt /mnt/target/run
chmod 1777 /mnt/target/tmp
printf '%s / ext4 defaults,noatime 0 1\n' "$TARGET" > /mnt/target/etc/fstab
umount /mnt/target
echo "=== Instalacao concluida com sucesso! ==="
EOF_INST
          chmod +x irm/usr/bin/install-to-emmc
          ln -sf /usr/bin/install-to-emmc irm/bin/install-to-emmc

          # 7. Write /init
          cat > irm/init <<'INIT'
#!/bin/busybox sh
export PATH=/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/usr/local/sbin

# Install busybox symlinks
/bin/busybox --install -s /bin 2>/dev/null || true

# Mount essential filesystems
mount -t proc none /proc
mount -t sysfs none /sys
mount -t devtmpfs none /dev
mkdir -p /dev/pts /dev/shm
mount -t devpts devpts /dev/pts
mount -t tmpfs tmpfs /dev/shm

# Disable display & console blanking (AMOLED screen stays awake)
echo 0 > /sys/class/graphics/fb0/blank 2>/dev/null || true
echo -ne "\033[9;0]" > /dev/tty0 2>/dev/null || true
echo -ne "\033[14;0]" > /dev/tty0 2>/dev/null || true

echo ""
echo "=========================================="
echo "   Alpine Linux ARMv7 (Linux 6.16)        "
echo "   Motorola Moto X 2014 (victara)         "
echo "=========================================="
echo ""

# Setup USB RNDIS & CDC ACM gadget via ConfigFS
mount -t configfs none /sys/kernel/config 2>/dev/null || true
G=/sys/kernel/config/usb_gadget/victara
mkdir -p "$G/strings/0x409" "$G/functions/rndis.usb0" "$G/functions/acm.usb0" "$G/configs/c.1/strings/0x409" 2>/dev/null || true
echo 0x22b8 > "$G/idVendor" 2>/dev/null || true
echo 0x2e82 > "$G/idProduct" 2>/dev/null || true
echo motorola > "$G/strings/0x409/manufacturer" 2>/dev/null || true
echo victara > "$G/strings/0x409/product" 2>/dev/null || true
echo 0014302157 > "$G/strings/0x409/serialnumber" 2>/dev/null || true
ln -sfn "$G/functions/rndis.usb0" "$G/configs/c.1/" 2>/dev/null || true
ln -sfn "$G/functions/acm.usb0" "$G/configs/c.1/" 2>/dev/null || true

echo "Aguardando controladora USB (UDC)..."
UDC=""
for i in $(seq 1 15); do
  UDC=$(ls -1 /sys/class/udc 2>/dev/null | head -n 1 || true)
  if [ -n "$UDC" ]; then
    echo "UDC detectada: $UDC"
    echo "$UDC" > "$G/UDC" 2>/dev/null || true
    break
  fi
  sleep 1
done

if [ -n "$UDC" ]; then
  for i in $(seq 1 5); do
    if ifconfig usb0 172.16.42.1 netmask 255.255.255.0 up 2>/dev/null; then
      ifconfig usb0:1 192.168.42.2 netmask 255.255.255.0 up 2>/dev/null || true
      echo "USB gadget ativo em 172.16.42.1 / 192.168.42.2"
      break
    fi
    sleep 1
  done

  # Iniciar Dropbear SSH (porta 22 e 2222, login root sem senha)
  /usr/sbin/dropbear -R -B -E -p 22 -p 2222 2>/dev/null || /usr/sbin/dropbear -B -p 22 2>/dev/null || true
  echo "SSH ativo na porta 22 (ssh root@172.16.42.1)"

  # Iniciar Telnetd na porta 23
  telnetd -l /bin/sh 2>/dev/null || true
  echo "Telnet aberto na porta 23 (telnet 172.16.42.1)"

  # Console serial USB persistente
  while true; do
    if [ -e /dev/ttyGS0 ]; then
      /bin/sh </dev/ttyGS0 >/dev/ttyGS0 2>&1
    fi
    sleep 1
  done &
  echo "Console serial USB ativo em /dev/ttyGS0"
else
  echo "UDC nao encontrada apos 15s"
fi

# Subir wlan0 em background assim que o hardware responder
(
  for i in $(seq 1 30); do
    if [ -d /sys/class/net/wlan0 ]; then
      ip link set wlan0 up 2>/dev/null || true
      echo "WiFi wlan0 detectado e pronto para conexao!"
      if [ -s /etc/wpa_supplicant/wpa_supplicant.conf ]; then
        wpa_supplicant -B -i wlan0 -c /etc/wpa_supplicant/wpa_supplicant.conf 2>/dev/null || true
        udhcpc -i wlan0 -b 2>/dev/null || true
      fi
      break
    fi
    sleep 1
  done
) &

echo ""
echo "=== Sistema pronto e aguardando conexoes ==="
echo "SSH:       ssh -o StrictHostKeyChecking=no root@172.16.42.1"
echo "Telnet:    telnet 172.16.42.1"
echo "Serial:    picocom -b 115200 /dev/ttyACM0"
echo "Wi-Fi:     wifi-connect <SSID> <SENHA>"
echo "Escanear:  wifi-scan"
echo "Bateria:   battery"
echo "Pacotes:   apk update && apk add <pacote>"
echo "Instalar:  install-to-emmc"
echo ""

while true; do
  /bin/sh
  sleep 1
done
INIT
          chmod +x irm/init
          (cd irm && find . -print0 | cpio --quiet -o -H newc --null | gzip -9 > ../initramfs.cpio.gz)
          gzip -d -c initramfs.cpio.gz > initramfs.cpio
          test -s initramfs.cpio
          cp initramfs.cpio.gz out/initramfs.cpio.gz

      - name: Pack fastboot boot images
        run: |
          set -euxo pipefail
          CMDLINE='console=ttyHSL0,115200,n8 console=tty0 consoleblank=0 lk2nd.pass-simplefb=xrgb8888,autorefresh clk_ignore_unused pd_ignore_unused msm.allow_vram_carveout=1 rootwait rw'
          # 1. boot-noids.img (appended DTB without msm-id, standard fastboot boot)
          python3 - initramfs.cpio out/zImage-dtb-noids out/boot-noids.img "$CMDLINE" <<'PY'
          import struct, hashlib, sys
          _, ramdisk, kernel, out, cmd = sys.argv
          kernel = open(kernel, 'rb').read()
          ramdisk = open(ramdisk, 'rb').read()
          page, base = 2048, 0x00000000
          def pad(b):
              return b + b'\0' * ((page - len(b) % page) % page)
          hdr = bytearray(b'ANDROID!')
          hdr += struct.pack('<10I', len(kernel), base + 0x8000, len(ramdisk), base + 0x1000000, 0, 0, base + 0x100, page, 0, 0)
          hdr += b'\0' * 16
          cmd = cmd.encode()
          hdr += cmd + b'\0' * (512 - len(cmd))
          hdr += hashlib.sha1(kernel + ramdisk).digest()[:20] + b'\0' * 12
          hdr += b'\0' * 1024
          open(out, 'wb').write(pad(bytes(hdr)) + pad(kernel) + pad(ramdisk))
          print('wrote', out)
          PY

          # 2. boot-table.img (QCDT table boot image for stock Motorola bootloader)
          python3 - out/msm8974pro-motorola-victara.dtb out/boot-table.img "$CMDLINE" <<'PY'
          import struct, hashlib, sys
          _, dtb_path, out, cmd_str = sys.argv
          dtb = open(dtb_path, 'rb').read()
          assert dtb[:4] == b'\xd0\x0d\xfe\xed'
          page = 2048
          def pad(b):
              return b + b'\0' * ((page - len(b) % page) % page)
          entries = [(194, 0x4D, 0x81B0), (194, 0x4D, 0x82A0), (194, 0x4D, 0x82B0), (194, 0x4D, 0x82BF)]
          table = struct.pack('<4sII', b'QCDT', 2, len(entries))
          off = ((len(table) + len(entries) * 24 + page - 1) // page) * page
          tbl, blob = b'', b''
          for pid, vid, srev in entries:
              tbl += struct.pack('<6I', pid, vid, srev, 0, off, len(dtb))
              blob += pad(dtb)
              off += len(pad(dtb))
          dt = table + tbl
          dt += b'\0' * (((len(dt) + page - 1) // page) * page - len(dt))
          dt += blob
          kernel = open('out/zImage', 'rb').read()
          ramdisk = open('initramfs.cpio', 'rb').read()
          base = 0x00000000
          hdr = bytearray(b'ANDROID!')
          hdr += struct.pack('<10I', len(kernel), base + 0x8000, len(ramdisk), base + 0x1000000, 0, 0, base + 0x100, page, len(dt), 0)
          hdr += b'\0' * 16
          cmd = cmd_str.encode()
          hdr += cmd + b'\0' * (512 - len(cmd))
          hdr += hashlib.sha1(kernel + ramdisk).digest()[:20] + b'\0' * 12
          hdr += b'\0' * 1024
          open(out, 'wb').write(pad(bytes(hdr)) + pad(kernel) + pad(ramdisk) + pad(dt))
          print('wrote', out, len(dt))
          PY

          # 3. boot-victara.img (Standard appended DTB boot image)
          python3 - initramfs.cpio out/zImage-dtb out/boot-victara.img "$CMDLINE" <<'PY'
          import struct, hashlib, sys
          _, ramdisk, kernel, out, cmd = sys.argv
          kernel = open(kernel, 'rb').read()
          ramdisk = open(ramdisk, 'rb').read()
          page, base = 2048, 0x00000000
          def pad(b):
              return b + b'\0' * ((page - len(b) % page) % page)
          hdr = bytearray(b'ANDROID!')
          hdr += struct.pack('<10I', len(kernel), base + 0x8000, len(ramdisk), base + 0x1000000, 0, 0, base + 0x100, page, 0, 0)
          hdr += b'\0' * 16
          cmd = cmd.encode()
          hdr += cmd + b'\0' * (512 - len(cmd))
          hdr += hashlib.sha1(kernel + ramdisk).digest()[:20] + b'\0' * 12
          hdr += b'\0' * 1024
          open(out, 'wb').write(pad(bytes(hdr)) + pad(kernel) + pad(ramdisk))
          print('wrote', out)
          PY

          ls -la out/
          sha256sum out/* | tee out/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: victara-mainline-kernel
          path: |
            out/boot-victara.img
            out/boot-noids.img
            out/boot-table.img
            out/zImage
            out/zImage-dtb
            out/zImage-dtb-noids
            out/msm8974pro-motorola-victara.dtb
            out/victara-noids.dtb
            out/kernel-modules-*.tar.zst
            out/kernel-modules-*.tar.gz
            out/victara-firmware-wcnss.tar.gz
            out/kernel-release.txt
            out/initramfs.cpio.gz
            out/kernel.config*
            out/System.map
            out/SHA256SUMS
          if-no-files-found: error
