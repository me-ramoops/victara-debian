name: Build victara Mainline Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_URL: https://gitlab.com/vanadium-oss/motorola-msm8974/mainline/linux-msm8974.git
  KERNEL_REF: qcom-msm8974-6.16.y

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq bc bison busybox-static cpio device-tree-compiler flex gcc-arm-linux-gnueabihf git gzip libssl-dev make python3 xz-utils zstd

      - name: Build kernel and DTBs
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_URL" kernel
          make -C kernel ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- msm8974_defconfig
          kernel/scripts/kconfig/merge_config.sh -m kernel/.config kernel/arch/arm/configs/victara.config
          make -C kernel ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          make -C kernel ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j"$(nproc)" zImage dtbs modules
          test -s kernel/arch/arm/boot/zImage
          test -s kernel/arch/arm/boot/dts/qcom/msm8974pro-motorola-victara.dtb
          make -C kernel ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -s kernelrelease | tee kernel-release.txt

      - name: Build no-ids DTB variant and appended zImage-dtb
        run: |
          set -euxo pipefail
          mkdir -p out
          KREL="$(cat kernel-release.txt)"
          cp kernel/arch/arm/boot/zImage out/zImage
          cp kernel/arch/arm/boot/dts/qcom/msm8974pro-motorola-victara.dtb out/msm8974pro-motorola-victara.dtb
          cp kernel/.config "out/kernel.config-$KREL"
          cp kernel/.config out/kernel.config
          cp kernel/System.map out/System.map
          cp kernel-release.txt out/

          # Build variant without qcom,msm-id for permissive bootloaders
          dtc -I dtb -O dts -o victara.dts out/msm8974pro-motorola-victara.dtb
          sed -i '/qcom,msm-id =/d' victara.dts
          dtc -I dts -O dtb -o out/victara-noids.dtb victara.dts
          python3 -c "b=open('out/victara-noids.dtb','rb').read(); assert b[:4]==b'\xd0\x0d\xfe\xed' and b'msm-id' not in b"

          # Appended DTB zImage
          cat out/zImage out/msm8974pro-motorola-victara.dtb > out/zImage-dtb
          cat out/zImage out/victara-noids.dtb > out/zImage-dtb-noids

      - name: Export kernel modules and firmware
        run: |
          set -euxo pipefail
          KREL="$(cat kernel-release.txt)"
          rm -rf modules-root
          mkdir -p modules-root
          make -C kernel ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- INSTALL_MOD_PATH="$PWD/modules-root" INSTALL_MOD_STRIP=1 modules_install
          tar -I 'zstd -T0 -10' -cf "out/kernel-modules-$KREL.tar.zst" -C modules-root lib/modules
          tar -czf "out/kernel-modules-$KREL.tar.gz" -C modules-root lib/modules
          rm -rf modules-root

          # Package WiFi firmware
          tar -czf out/victara-firmware-wcnss.tar.gz -C firmware .

      - name: Build minimal fallback ramdisk
        run: |
          set -euxo pipefail
          rm -rf irm && mkdir -p irm/bin irm/proc irm/sys irm/dev irm/newroot
          # Download real armv7 static busybox from Alpine v3.20
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/main/armv7/busybox-static-1.36.1-r31.apk | tar -xzO bin/busybox.static > irm/bin/busybox
          chmod +x irm/bin/busybox
          cat > irm/init <<'INIT'
          #!/bin/busybox sh
          /bin/busybox mount -t proc none /proc
          /bin/busybox mount -t sysfs none /sys
          /bin/busybox mount -t devtmpfs none /dev

          # Setup USB RNDIS gadget immediately
          /bin/busybox mount -t configfs none /sys/kernel/config 2>/dev/null || true
          G=/sys/kernel/config/usb_gadget/victara
          /bin/busybox mkdir -p "$G/strings/0x409" "$G/functions/rndis.usb0" "$G/configs/c.1/strings/0x409" 2>/dev/null || true
          echo 0x22b8 > "$G/idVendor" 2>/dev/null || true
          echo 0x2e82 > "$G/idProduct" 2>/dev/null || true
          echo motorola > "$G/strings/0x409/manufacturer" 2>/dev/null || true
          echo victara > "$G/strings/0x409/product" 2>/dev/null || true
          echo 0014302157 > "$G/strings/0x409/serialnumber" 2>/dev/null || true
          /bin/busybox ln -sfn "$G/functions/rndis.usb0" "$G/configs/c.1/" 2>/dev/null || true
          UDC=$(ls /sys/class/udc/ 2>/dev/null | head -n 1)
          if [ -n "$UDC" ]; then echo "$UDC" > "$G/UDC" 2>/dev/null || true; fi
          /bin/busybox ifconfig usb0 172.16.42.1 netmask 255.255.255.0 up 2>/dev/null || true
          /bin/busybox ifconfig usb0:1 192.168.42.2 netmask 255.255.255.0 up 2>/dev/null || true
          /bin/busybox telnetd -l /bin/sh 2>/dev/null || true

          echo "=== victara mainline kernel boot ==="
          echo "USB gadget active on 172.16.42.1 / 192.168.42.2"
          # Wait up to 15 seconds for eMMC storage to initialize
          for i in $(/bin/busybox seq 1 15); do
            for dev in /dev/mmcblk0p25 /dev/mmcblk0p28; do
              if [ -b "$dev" ]; then
                echo "Trying root on $dev..."
                if /bin/busybox mount -o rw "$dev" /newroot 2>/dev/null; then
                  if [ -x /newroot/sbin/init ] || [ -f /newroot/bin/busybox ]; then
                    echo "Rootfs mounted successfully from $dev, switching root..."
                    /bin/busybox mount --move /proc /newroot/proc
                    /bin/busybox mount --move /sys /newroot/sys
                    /bin/busybox mount --move /dev /newroot/dev
                    exec /bin/busybox switch_root /newroot /sbin/init
                  fi
                  /bin/busybox umount /newroot 2>/dev/null || true
                fi
              fi
            done
            /bin/busybox sleep 1
          done
          echo "No valid rootfs found, emergency shell with USB active."
          exec /bin/busybox sh
          INIT
          chmod +x irm/init
          (cd irm && find . -print0 | cpio --quiet -o -H newc --null | gzip -9 > ../initramfs.cpio.gz)
          gzip -d -c initramfs.cpio.gz > initramfs.cpio
          test -s initramfs.cpio

      - name: Pack fastboot boot images
        run: |
          set -euxo pipefail
          CMDLINE='console=tty0 console=ttyHSL0,115200,n8 lk2nd.pass-simplefb=xrgb8888,autorefresh rootwait rw'
          # 1. boot-noids.img (appended DTB without msm-id, standard fastboot boot)
          python3 - initramfs.cpio out/zImage-dtb-noids out/boot-noids.img "$CMDLINE" <<'PY'
          import struct, hashlib, sys
          _, ramdisk, kernel, out, cmd = sys.argv
          kernel = open(kernel, 'rb').read()
          ramdisk = open(ramdisk, 'rb').read()
          page, base = 2048, 0x00000000
          def pad(b):
              return b + b'\0' * ((page - len(b) % page) % page)
          hdr = bytearray(b'ANDROID!')
          hdr += struct.pack('<10I', len(kernel), base + 0x8000, len(ramdisk), base + 0x1000000, 0, 0, base + 0x100, page, 0, 0)
          hdr += b'\0' * 16
          cmd = cmd.encode()
          hdr += cmd + b'\0' * (512 - len(cmd))
          hdr += hashlib.sha1(kernel + ramdisk).digest()[:20] + b'\0' * 12
          hdr += b'\0' * 1024
          open(out, 'wb').write(pad(bytes(hdr)) + pad(kernel) + pad(ramdisk))
          print('wrote', out)
          PY

          # 2. boot-table.img (QCDT table boot image for stock Motorola bootloader)
          python3 - out/msm8974pro-motorola-victara.dtb out/boot-table.img <<'PY'
          import struct, hashlib, sys
          _, dtb_path, out = sys.argv
          dtb = open(dtb_path, 'rb').read()
          assert dtb[:4] == b'\xd0\x0d\xfe\xed'
          page = 2048
          def pad(b):
              return b + b'\0' * ((page - len(b) % page) % page)
          entries = [(194, 0x4D, 0x81B0), (194, 0x4D, 0x82A0), (194, 0x4D, 0x82B0), (194, 0x4D, 0x82BF)]
          table = struct.pack('<4sII', b'QCDT', 2, len(entries))
          off = ((len(table) + len(entries) * 24 + page - 1) // page) * page
          tbl, blob = b'', b''
          for pid, vid, srev in entries:
              tbl += struct.pack('<6I', pid, vid, srev, 0, off, len(dtb))
              blob += pad(dtb)
              off += len(pad(dtb))
          dt = table + tbl
          dt += b'\0' * (((len(dt) + page - 1) // page) * page - len(dt))
          dt += blob
          kernel = open('out/zImage', 'rb').read()
          ramdisk = open('initramfs.cpio', 'rb').read()
          base = 0x00000000
          hdr = bytearray(b'ANDROID!')
          hdr += struct.pack('<10I', len(kernel), base + 0x8000, len(ramdisk), base + 0x1000000, 0, 0, base + 0x100, page, len(dt), 0)
          hdr += b'\0' * 16
          cmd = b'console=tty0 console=ttyHSL0,115200,n8 root=/dev/mmcblk0p28 rootwait rw'
          hdr += cmd + b'\0' * (512 - len(cmd))
          hdr += hashlib.sha1(kernel + ramdisk).digest()[:20] + b'\0' * 12
          hdr += b'\0' * 1024
          open(out, 'wb').write(pad(bytes(hdr)) + pad(kernel) + pad(ramdisk) + pad(dt))
          print('wrote', out, len(dt))
          PY

          # 3. boot-victara.img (Standard appended DTB boot image)
          python3 - initramfs.cpio out/zImage-dtb out/boot-victara.img "$CMDLINE" <<'PY'
          import struct, hashlib, sys
          _, ramdisk, kernel, out, cmd = sys.argv
          kernel = open(kernel, 'rb').read()
          ramdisk = open(ramdisk, 'rb').read()
          page, base = 2048, 0x00000000
          def pad(b):
              return b + b'\0' * ((page - len(b) % page) % page)
          hdr = bytearray(b'ANDROID!')
          hdr += struct.pack('<10I', len(kernel), base + 0x8000, len(ramdisk), base + 0x1000000, 0, 0, base + 0x100, page, 0, 0)
          hdr += b'\0' * 16
          cmd = cmd.encode()
          hdr += cmd + b'\0' * (512 - len(cmd))
          hdr += hashlib.sha1(kernel + ramdisk).digest()[:20] + b'\0' * 12
          hdr += b'\0' * 1024
          open(out, 'wb').write(pad(bytes(hdr)) + pad(kernel) + pad(ramdisk))
          print('wrote', out)
          PY

          ls -la out/
          sha256sum out/* | tee out/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: victara-mainline-kernel
          path: |
            out/boot-victara.img
            out/boot-noids.img
            out/boot-table.img
            out/zImage
            out/zImage-dtb
            out/zImage-dtb-noids
            out/msm8974pro-motorola-victara.dtb
            out/victara-noids.dtb
            out/kernel-modules-*.tar.zst
            out/kernel-modules-*.tar.gz
            out/victara-firmware-wcnss.tar.gz
            out/kernel-release.txt
            out/kernel.config*
            out/System.map
            out/SHA256SUMS
          if-no-files-found: error
